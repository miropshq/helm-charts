# Default values for mirops
# Declare variables to be passed into your templates

# Namespace configuration
# create: keep this false and let Helm create the namespace instead — `--create-namespace` on the CLI,
#   or `create_namespace = true` in the Terraform helm_release. That is the single knob for the
#   namespace, and it works for every case (including compatMatrix, whose pre-install hook needs the
#   namespace to exist before the chart's normal resources). Set create: true only if you specifically
#   want the chart to own the Namespace resource — then do NOT also pass Helm's --create-namespace.
namespace:
  create: false
  name: mirops

# Image configuration
image:
  repository: ghcr.io/miropshq/mirops/operator
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

# Image pull secrets for private registries
imagePullSecrets: []
# - name: ghcr-secret

# Docker credentials for private registries
registryCredentials:
  enabled: false
  registry: ghcr.io
  username: ""
  password: "" # Use personal access token (PAT) instead of password
  email: ""
replicaCount: 1

# Service Account configuration
serviceAccount:
  create: true
  name: mirops-controller-manager
  # Annotations added to the operator ServiceAccount(s). Empty by default (works everywhere).
  # Cloud workload-identity is opt-in here — set only for the environment you run in:
  #   AWS (EKS, IRSA):        eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  #   Azure (AKS, Workload Identity): azure.workload.identity/client-id: <managed-identity-client-id>
  #     Optionally also set the tenant when the cluster's default OIDC tenant isn't the identity's
  #     (e.g. cross-tenant): azure.workload.identity/tenant-id: <tenant-id>
  annotations: {}

# RBAC configuration
rbac:
  create: true

# Pod annotations
podAnnotations: {}

# Extra labels added to the operator pods. Empty by default (no effect on-prem / any cloud).
# Azure AKS Workload Identity requires a pod label to trigger token injection — set it here:
#   podLabels:
#     azure.workload.identity/use: "true"
# (AWS IRSA and on-prem need no pod label, so leave this empty there.)
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Metrics configuration
metrics:
  enabled: true
  port: 8080

# Health probes configuration
healthProbe:
  port: 8081

# Reports HTTP server configuration
# The operator exposes reports via HTTP so Headlamp and other UIs can read them.
reports:
  port: 8084
  dir: /var/mirops/reports

# Persistent report storage for on-premises clusters (UpgradeAnalysis source.type: pvc).
# When enabled, a PVC is mounted at mountPath; set the CR's source.path to the same path
# (or leave it empty to use the operator default /mnt/mirops-reports — keep mountPath in sync).
reportPVC:
  enabled: false
  # existingClaim: use a PVC you already created. When empty, the chart creates one.
  existingClaim: ""
  mountPath: /mnt/mirops-reports
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Leader election
leaderElection:
  enabled: true

# Log level
logLevel: info

# Compatibility matrix — the add-on ↔ Kubernetes source the operator uses.
#
# By default (enabled: false) the operator uses its EMBEDDED matrix (baked into the image at build).
# That is deterministic and works offline/air-gapped — the recommended default.
#
# Enable this to pull a specific published matrix version from OCI into the override ConfigMap
# 'mirops-compatibility-matrix' (which the operator already reads), so the matrix is decoupled from
# the operator image — update it without rebuilding the operator. A pre-install/pre-upgrade Helm hook
# Job does the pull.
#
#   version: latest          -> newest published matrix (freshest; use for non-prod / to stay current)
#   version: v2026.06.15     -> pin a date tag (reproducible; recommended for production)
compatMatrix:
  enabled: false
  repo: ghcr.io/miropshq/mirops-compat
  version: latest
  # Registry auth for the OCI pull (needed only while the matrix artifact is private):
  #   - Leave both empty for a PUBLIC artifact (anonymous pull).
  #   - Set registryCredentials.enabled=true to reuse the same PAT that pulls the operator image.
  #   - Or point pullSecret at an existing kubernetes.io/dockerconfigjson secret.
  pullSecret: ""
  # Images the pull Job uses.
  orasImage: ghcr.io/oras-project/oras:v1.2.0
  # kubectlImage MUST have a shell (/bin/sh) — the Job runs `kubectl create --dry-run | kubectl apply`
  # through sh. Distroless kubectl images (e.g. registry.k8s.io/kubectl) have no shell and fail.
  kubectlImage: alpine/k8s:1.31.0

# Remediation manager configuration
remediation:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/miropshq/mirops/remediation
    pullPolicy: IfNotPresent
    tag: "v0.1.0"

  healthProbe:
    port: 8082

  metrics:
    port: 8083

  leaderElection:
    enabled: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
