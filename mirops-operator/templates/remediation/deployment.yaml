{{- if .Values.remediation.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirops.fullname" . }}-remediation-manager
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mirops.labels" . | nindent 4 }}
    control-plane: remediation-manager
spec:
  replicas: {{ .Values.remediation.replicaCount }}
  selector:
    matchLabels:
      {{- include "mirops.selectorLabels" . | nindent 6 }}
      control-plane: remediation-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mirops.selectorLabels" . | nindent 8 }}
        control-plane: remediation-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mirops.fullname" . }}-remediation-manager
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: remediation-manager
        image: "{{ .Values.remediation.image.repository }}:{{ .Values.remediation.image.tag }}"
        imagePullPolicy: {{ .Values.remediation.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        args:
          - --health-probe-bind-address={{ printf ":%d" (.Values.remediation.healthProbe.port | int) }}
          - --metrics-bind-address={{ printf ":%d" (.Values.remediation.metrics.port | int) }}
          {{- if .Values.remediation.leaderElection.enabled }}
          - --leader-elect
          {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.remediation.metrics.port }}
          protocol: TCP
        - name: healthz
          containerPort: {{ .Values.remediation.healthProbe.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.remediation.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
