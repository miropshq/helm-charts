{{- if and .Values.remediation.enabled .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mirops.fullname" . }}-remediation-rolebinding
  labels:
    {{- include "mirops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mirops.fullname" . }}-remediation-role
subjects:
- kind: ServiceAccount
  name: {{ include "mirops.fullname" . }}-remediation-manager
  namespace: {{ .Values.namespace.name }}
{{- end }}
