{{- if .Values.metrics.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mirops.fullname" . }}-controller-manager-metrics-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mirops.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  ports:
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "mirops.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
