apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirops.fullname" . }}-controller-manager
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mirops.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mirops.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mirops.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mirops.fullname" . }}-controller-manager
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- else if .Values.registryCredentials.enabled }}
      imagePullSecrets:
        - name: {{ include "mirops.fullname" . }}-ghcr-secret
      {{- end }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        args:
          {{- if .Values.leaderElection.enabled }}
          - --leader-elect
          {{- end }}
          - --metrics-bind-address={{ printf ":%d" (.Values.metrics.port | int) }}
          - --health-probe-bind-address={{ printf ":%d" (.Values.healthProbe.port | int) }}
          - --reports-bind-address={{ printf ":%d" (.Values.reports.port | int) }}
          - --reports-dir={{ .Values.reports.dir }}
        env:
        - name: CONTROLLER_NAME
          value: "mirops-upgrade-analysis"
        # UpgradeAnalysis/RemediationPlan are cluster-scoped, so the operator reads its own
        # dependencies (AI secret, compatibility-matrix ConfigMap) from its own namespace.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        - name: healthz
          containerPort: {{ .Values.healthProbe.port }}
          protocol: TCP
        - name: reports
          containerPort: {{ .Values.reports.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: reports
            mountPath: {{ .Values.reports.dir }}
          {{- if .Values.reportPVC.enabled }}
          - name: report-pvc
            mountPath: {{ .Values.reportPVC.mountPath }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: reports
          emptyDir: {}
        {{- if .Values.reportPVC.enabled }}
        - name: report-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.reportPVC.existingClaim | default (printf "%s-report" (include "mirops.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
