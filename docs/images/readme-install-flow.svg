<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Mirops Helm installation flow</title><desc id="desc">Choose the local chart checkout or a published OCI chart and version, install it in the Mirops namespace, allow the operator CRDs to be installed, then create UpgradeAnalysis or RemediationPlan resources as needed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="360" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Install the chart, then create the resources you need</text>
<g filter="url(#s)"><rect x="45" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="330" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="615" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="900" y="125" width="155" height="135" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
<text x="150" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Choose chart</text><text x="150" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Local checkout</text><text x="150" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">or published OCI</text>
<text x="435" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">helm upgrade --install</text><text x="435" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Namespace: mirops</text><text x="435" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Pin released versions</text>
<text x="720" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#047857">Operator ready</text><text x="720" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">CRDs available</text><text x="720" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Review chart values</text>
<text x="977" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">Create CRs</text><text x="977" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">UpgradeAnalysis</text><text x="977" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">RemediationPlan</text>
<path d="M255 192H319" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M540 192H604" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M825 192H889" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="48" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Install does not create analysis resources. Create them only after the operator is ready.</text></svg>