<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Helm chart validation and release workflow</title><desc id="desc">Validate a chart change by linting, rendering manifests for inspection, upgrading an existing release, then uninstalling when cleaning up. Pin image and compatibility snapshot versions for reproducibility.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="360" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Inspect chart output before changing a release</text>
<g filter="url(#s)"><rect x="45" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="330" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="615" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="900" y="125" width="155" height="135" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
<text x="150" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">helm lint</text><text x="150" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Check chart structure</text><text x="150" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Catch value errors</text>
<text x="435" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">helm template</text><text x="435" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Render manifests</text><text x="435" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Inspect before applying</text>
<text x="720" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#047857">helm upgrade</text><text x="720" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Apply to release</text><text x="720" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Pin chart and image</text>
<text x="977" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">helm uninstall</text><text x="977" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Clean up release</text><text x="977" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">When appropriate</text>
<path d="M255 192H319" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M540 192H604" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M825 192H889" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="48" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Use --create-namespace or namespace.create=true; choose only one namespace-creation mechanism.</text></svg>