<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Mirops Helm chart architecture</title><desc id="desc">The Helm chart installs the Mirops operator, report service, and optional remediation manager. The operator manages UpgradeAnalysis and RemediationPlan resources, while the report service provides reports to the CLI and Headlamp. A pinned compatibility snapshot can optionally be pulled during installation.</desc>
