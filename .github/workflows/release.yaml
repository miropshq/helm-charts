name: Mirops Helm Chart CI Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: mirops-operator

jobs:
  validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Helm lint
        working-directory: ${{ env.CHART_DIR }}
        run: helm lint .

      - name: Helm template (render all manifests)
        working-directory: ${{ env.CHART_DIR }}
        run: helm template mirops . --debug > /dev/null


      - name: Validate image tags are not dev
        working-directory: ${{ env.CHART_DIR }}
        run: |
          OPERATOR_TAG=$(grep -A5 "^image:" values.yaml | grep -E "^[[:space:]]+tag:" | head -1 | awk '{print $2}' | tr -d '"')
          REMEDIATION_TAG=$(grep -A5 "^  image:" values.yaml | grep -E "^[[:space:]]+tag:" | head -1 | awk '{print $2}' | tr -d '"')

          for TAG in "$OPERATOR_TAG" "$REMEDIATION_TAG"; do
            if echo "$TAG" | grep -qiE '(dev|development|latest|snapshot)'; then
              echo "ERROR: image tag '$TAG' is not allowed in main. Use a semver version (e.g. v1.0.0)"
              exit 1
            fi
            if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "ERROR: image tag '$TAG' does not follow the vX.Y.Z format"
              exit 1
            fi
          done
          echo "Valid image tags: operator=$OPERATOR_TAG remediation=$REMEDIATION_TAG"

          # Artifact Hub lists (and security-scans) the images in Chart.yaml's artifacthub.io/images;
          # they must be the ones values.yaml installs.
          for IMAGE in "operator:$OPERATOR_TAG" "remediation:$REMEDIATION_TAG"; do
            if ! grep -q "image: ghcr.io/miropshq/mirops/$IMAGE\$" Chart.yaml; then
              echo "ERROR: Chart.yaml artifacthub.io/images doesn't list ghcr.io/miropshq/mirops/$IMAGE (values.yaml)"
              exit 1
            fi
          done

  publish:
    name: Publish Helm Chart to OCI Registry
    runs-on: ubuntu-latest
    needs: validate
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No CRD handling here: the operator embeds and installs its own CRDs at startup, so the chart
      # only ships the workloads and RBAC. Choosing an image tag chooses the matching CRDs.
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Login to GitHub Container Registry
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Helm chart
        working-directory: ${{ env.CHART_DIR }}
        run: |
          CHART_VERSION=$(grep "^version:" Chart.yaml | awk '{print $2}')
          CHART_NAME=$(grep "^name:" Chart.yaml | awk '{print $2}')

          helm package .

          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      # Artifact Hub reads an OCI chart from the registry, not from git: the repository metadata
      # (ownership / Verified Publisher) goes next to the chart as the `artifacthub.io` tag. Nothing
      # is committed to main or to any branch.
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Publish Artifact Hub repository metadata
        run: |
          CHART_NAME=$(grep "^name:" ${{ env.CHART_DIR }}/Chart.yaml | awk '{print $2}')
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username ${{ github.actor }} --password-stdin
          oras push ghcr.io/${{ github.repository_owner }}/charts/${CHART_NAME}:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Logout from GitHub Container Registry
        if: always()
        run: |
          helm registry logout ghcr.io
          oras logout ghcr.io || true

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
