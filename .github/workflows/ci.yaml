name: Mirops Helm Chart CI

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Helm lint
        working-directory: mirops-operator
        run: helm lint .

      - name: Helm template (render all manifests)
        working-directory: mirops-operator
        run: helm template mirops . --debug > /dev/null

      - name: Validate chart version format
        working-directory: mirops-operator
        run: |
          VERSION=$(grep "^version:" Chart.yaml | awk '{print $2}')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$VERSION' no sigue semver (X.Y.Z)"
            exit 1
          fi
          echo "Version válida: $VERSION"

  sync-crd:
    name: Sync CRD from Operator Repo
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout operator repo
        uses: actions/checkout@v4
        with:
          repository: miropshq/mirops
          token: ${{ secrets.CRD_TOKEN }}
          path: mirops-operator-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mirops-operator-src/go.mod

      - name: Generate CRD manifests
        working-directory: mirops-operator-src
        run: make manifests

      - name: Upload CRD artifact
        uses: actions/upload-artifact@v4
        with:
          name: crd-upgradeanalyses
          path: mirops-operator-src/config/crd/bases/mirops.mirops.io_upgradeanalyses.yaml
          retention-days: 1

  publish:
    name: Publish Helm Chart to OCI Registry
    runs-on: ubuntu-latest
    needs: sync-crd
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CRD artifact
        uses: actions/download-artifact@v4
        with:
          name: crd-upgradeanalyses
          path: mirops-operator/crds

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Login to GitHub Container Registry
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Helm chart
        working-directory: mirops-operator
        run: |
          CHART_VERSION=$(grep "^version:" Chart.yaml | awk '{print $2}')
          CHART_NAME=$(grep "^name:" Chart.yaml | awk '{print $2}')

          helm package .

          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Logout from GitHub Container Registry
        if: always()
        run: helm registry logout ghcr.io
