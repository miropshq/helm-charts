name: Mirops Helm Chart CI Feature Branches

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

env:
  CHART_DIR: mirops-operator

jobs:
  validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Helm lint
        working-directory: ${{ env.CHART_DIR }}
        run: helm lint .

      - name: Helm template (render all manifests)
        working-directory: ${{ env.CHART_DIR }}
        run: helm template mirops . --debug > /dev/null

