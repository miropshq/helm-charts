name: CI - Feature / PR (validate)

# Validation-only pipeline. Runs on every PR targeting main. It never pushes
# images or artifacts — it only proves the code is sound so a green check means
# the PR is safe to merge.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CHART_DIR: mirops-operator

jobs:

  validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
          
      - name: Helm template (render all manifests)
        working-directory: ${{ env.CHART_DIR }}
        run: helm template mirops . --debug > /dev/null

      - name: Helm template (render all manifests)
        working-directory: mirops-operator
        run: helm template mirops . --debug > /dev/null

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
