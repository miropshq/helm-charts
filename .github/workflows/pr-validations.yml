name: CI - Feature / PR (validate)

# Validation-only pipeline. Runs on every PR targeting main. It never pushes
# images or artifacts — it only proves the code is sound so a green check means
# the PR is safe to merge.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CHART_DIR: mirops-operator

jobs:

  validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
          
      - name: Helm template (render all manifests)
        working-directory: ${{ env.CHART_DIR }}
        run: helm template mirops . --debug > /dev/null

      - name: Helm template (render all manifests)
        working-directory: mirops-operator
        run: helm template mirops . --debug > /dev/null
