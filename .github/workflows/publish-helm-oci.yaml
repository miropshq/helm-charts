name: Publish Mirops Helm Chart

on:
  push:
    branches:
      - development-v2

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Mirops Helm Chart to OCI Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Login to GitHub Container Registry
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Helm chart
        working-directory: mirops-operator
        run: |          
          # Crear el paquete Helm
          helm package .
          
          # Determinar versión
          CHART_VERSION=$(grep "^version:" Chart.yaml | awk '{print $2}')
          CHART_NAME=$(grep "^name:" Chart.yaml | awk '{print $2}')
          
          # Push a OCI registry de forma privada
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Logout from GitHub Container Registry
        if: always()
        run: |
          helm registry logout ghcr.io
